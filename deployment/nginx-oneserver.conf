# HTTP redirection to HTTPS (oneserver.app & www.oneserver.app)
server {
    listen 80;
    listen [::]:80;
    server_name oneserver.app www.oneserver.app;

    # Certbot ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://oneserver.app$request_uri;
    }
}

# HTTP redirection to HTTPS (relay.oneserver.app)
server {
    listen 80;
    listen [::]:80;
    server_name relay.oneserver.app;

    # Certbot ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://relay.oneserver.app$request_uri;
    }
}

# HTTPS — oneserver.app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oneserver.app;

    # SSL Configuration (Certbot templates)
    ssl_certificate /etc/letsencrypt/live/oneserver.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneserver.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Next.js Website Proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTPS — relay.oneserver.app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.oneserver.app;

    # SSL Configuration (Certbot templates)
    ssl_certificate /etc/letsencrypt/live/oneserver.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneserver.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # WebSocket Relay Server Proxy
    location / {
        proxy_pass http://127.0.0.1:8080;
        
        # WebSocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffer for WebSocket streaming
        proxy_buffering off;

        # Keep-alive settings for long-lived WebSocket connections
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
