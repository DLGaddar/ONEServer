name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'apps/relay/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/oneserver
            git pull origin main

            # Relay
            cd apps/relay
            npm install
            npm run build
            pm2 reload oneserver-relay

            # Website
            cd ../website
            npm install
            npm run build
            cp -r public .next/standalone/public
            cp -r .next/static .next/standalone/.next/static
            pm2 reload oneserver-website

            echo "✅ Deploy tamamlandı"
